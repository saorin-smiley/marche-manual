<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画像だけのページ｜マルシェ運営マニュアル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"M PLUS Rounded 1c", sans-serif; background:#FFFBF3; color:#6B4A2F; font-size:19px; line-height:1.85; }
  .awning { height:40px; background:repeating-linear-gradient(90deg,#F49E8F 0 32px,#FFF3D6 32px 64px); }
  .scallop { height:20px; background:radial-gradient(circle at 16px -5px,#F49E8F 15px,transparent 16px),radial-gradient(circle at 48px -5px,#FFF3D6 15px,transparent 16px); background-size:64px 20px; background-repeat:repeat-x; }
  .wrap { max-width:680px; margin:0 auto; padding:10px 20px 60px; }
  .back { display:inline-block; margin:12px 0 4px; color:#C08552; font-weight:700; text-decoration:none; font-size:17px; }
  h1 { font-size:29px; font-weight:800; margin:8px 0 14px; }
  .intro { background:#fff; border:2px solid #F6DFC8; border-radius:18px; padding:18px 20px; margin-bottom:28px; }
  .sec { background:#fff; border-radius:20px; padding:24px 22px; margin-bottom:22px; box-shadow:0 3px 10px rgba(180,130,80,.08); }
  .sec h2 { font-size:24px; font-weight:800; border-left:8px solid #F49E8F; padding-left:12px; margin-bottom:14px; }
  .sec h3 { font-size:21px; font-weight:800; margin:20px 0 8px; color:#8A5A33; }
  .sec p { margin-bottom:10px; }
  .sec ol, .sec ul { margin:0 0 12px 1.4em; }
  .sec li { margin-bottom:6px; }
  .vbtn { display:block; text-align:center; background:#F49E8F; color:#fff; font-weight:800; text-decoration:none; border-radius:999px; padding:13px 18px; margin:14px 0 18px; font-size:18px; }
  .vbtn.sub { background:#F2B8AC; }
  .point { background:#FFF3EC; border:2px dashed #F2B8AC; border-radius:14px; padding:12px 16px; margin:12px 0; font-size:18px; }
  .point b { color:#E0785F; }
  .shot { margin:14px 0 6px; }
  .shot img { width:100%; border-radius:12px; border:1px solid #EFE3D2; display:block; }
  .shot figcaption { font-size:15px; color:#A9805D; margin-top:4px; }
  .shot.phone img { max-width:430px; margin:0 auto; }
  .shot.phone figcaption { text-align:center; }
  .link { color:#4A7FB5; font-weight:700; word-break:break-all; }
  .totop { display:block; text-align:center; margin-top:30px; color:#C08552; font-weight:700; text-decoration:none; }
  .pagenav { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:34px; }
  .pagenav a { background:#fff; border:2px solid #F0DFC8; border-radius:999px; padding:8px 16px; color:#C08552; font-weight:700; text-decoration:none; font-size:17px; white-space:nowrap; }
</style>
</head>
<body>
  <div class="awning"></div>
  <div class="scallop"></div>
  <div class="wrap">
    <a class="back" href="index.html">← トップページへもどる</a>
    <h1>画像だけのページ📸</h1>
    <div class="intro">
      マニュアルに出てくる画面の画像だけを集めたページです。<br>
      画像だけを見て進めたいときにご覧ください🌷
    </div>

    <div class="sec">
      <h2>アカウント登録の画面</h2>
      <figure class="shot"><img src="img/s1-form.jpg" alt="STEP1：利用登録フォームを開きます" loading="lazy"><figcaption>STEP1：利用登録フォームを開きます</figcaption></figure>
      <figure class="shot"><img src="img/s1-info.jpg" alt="STEP2：出店者情報の入力例（テストデータで入力されています）" loading="lazy"><figcaption>STEP2：出店者情報の入力例（テストデータで入力されています）</figcaption></figure>
      <figure class="shot"><img src="img/s1-bank.jpg" alt="STEP3：振込先口座の入力例" loading="lazy"><figcaption>STEP3：振込先口座の入力例</figcaption></figure>
      <figure class="shot"><img src="img/s1-terms.jpg" alt="STEP4：利用規約の確認と送信" loading="lazy"><figcaption>STEP4：利用規約の確認と送信</figcaption></figure>
      <figure class="shot"><img src="img/s1-mail.jpg" alt="STEP5：アカウント発行メールの例（ID・パスワードは黒塗りされています）" loading="lazy"><figcaption>STEP5：アカウント発行メールの例（ID・パスワードは黒塗りされています）</figcaption></figure>
    </div>

    <div class="sec">
      <h2>出店内容の登録の画面</h2>
      <figure class="shot"><img src="img/s2-login.jpg" alt="ログイン画面" loading="lazy"><figcaption>ログイン画面</figcaption></figure>
      <figure class="shot"><img src="img/s2-login2.jpg" alt="IDとパスワードを入力します（パスワードは伏せ字になります）" loading="lazy"><figcaption>IDとパスワードを入力します（パスワードは伏せ字になります）</figcaption></figure>
      <figure class="shot"><img src="img/s2-menu.jpg" alt="メインメニューから「講座・イベント日程」を選びます" loading="lazy"><figcaption>メインメニューから「講座・イベント日程」を選びます</figcaption></figure>
      <figure class="shot"><img src="img/s2-cal.jpg" alt="カレンダー画面の「新規登録」ボタン" loading="lazy"><figcaption>カレンダー画面の「新規登録」ボタン</figcaption></figure>
      <figure class="shot"><img src="img/s2-basic.jpg" alt="基本情報の入力画面" loading="lazy"><figcaption>基本情報の入力画面</figcaption></figure>
      <figure class="shot"><img src="img/s2-imgicon.jpg" alt="「詳細」欄の画像アイコンを押します" loading="lazy"><figcaption>「詳細」欄の画像アイコンを押します</figcaption></figure>
      <figure class="shot"><img src="img/s2-file.jpg" alt="使いたい画像ファイルを選んで「開く」を押します" loading="lazy"><figcaption>使いたい画像ファイルを選んで「開く」を押します</figcaption></figure>
      <figure class="shot"><img src="img/s2-img1.jpg" alt="挿入した直後の画像（まだ小さい状態）" loading="lazy"><figcaption>挿入した直後の画像（まだ小さい状態）</figcaption></figure>
      <figure class="shot"><img src="img/s2-img2.jpg" alt="横幅いっぱいまで広げたところ" loading="lazy"><figcaption>横幅いっぱいまで広げたところ</figcaption></figure>
      <figure class="shot"><img src="img/s2-zoom.jpg" alt="個別連絡事項（お申込み）の入力らん" loading="lazy"><figcaption>個別連絡事項（お申込み）の入力らん</figcaption></figure>
      <figure class="shot"><img src="img/s2-add.jpg" alt="開催日・時間と接続情報を設定します（Zoomリンクは伏せています）" loading="lazy"><figcaption>開催日・時間と接続情報を設定します（Zoomリンクは伏せています）</figcaption></figure>
      <figure class="shot"><img src="img/s2-add2.jpg" alt="「追加」ボタンで2日程目を足したところ" loading="lazy"><figcaption>「追加」ボタンで2日程目を足したところ</figcaption></figure>
      <figure class="shot"><img src="img/s2-item.jpg" alt="商品欄の入力例" loading="lazy"><figcaption>商品欄の入力例</figcaption></figure>
      <figure class="shot"><img src="img/s2-save.jpg" alt="入力が終わったら一番下の「保存」を押します" loading="lazy"><figcaption>入力が終わったら一番下の「保存」を押します</figcaption></figure>
      <figure class="shot"><img src="img/s2-view.jpg" alt="保存後の照会画面（左上に「URLコピー」があります）" loading="lazy"><figcaption>保存後の照会画面（左上に「URLコピー」があります）</figcaption></figure>
    </div>

    <div class="sec">
      <h2>プロフィール画像（iPhoneの切り取り）</h2>
      <figure class="shot phone"><img src="img/p1-open.jpg" alt="写真を開いて、右上の「編集」をタップします" loading="lazy"><figcaption>写真を開いて、右上の「編集」をタップします</figcaption></figure>
      <figure class="shot phone"><img src="img/p2-edit.jpg" alt="下のメニューで「切り取り」のマークをタップします" loading="lazy"><figcaption>下のメニューで「切り取り」のマークをタップします</figcaption></figure>
      <figure class="shot phone"><img src="img/p3-square.jpg" alt="比率は「正方形」を選んで、顔が真ん中に来るよう調整します" loading="lazy"><figcaption>比率は「正方形」を選んで、顔が真ん中に来るよう調整します</figcaption></figure>
      <figure class="shot phone"><img src="img/p4-done.jpg" alt="右上の「完了」をタップすれば保存できます" loading="lazy"><figcaption>右上の「完了」をタップすれば保存できます</figcaption></figure>
    </div>

    <div class="pagenav"><span></span><a href="index.html">トップへ</a><span></span></div>
  </div>
</body>
</html>
