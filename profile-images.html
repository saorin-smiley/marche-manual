<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プロフィール画像の画面｜マルシェ運営マニュアル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"M PLUS Rounded 1c", sans-serif; background:#FFFBF3; color:#6B4A2F; font-size:19px; line-height:1.85; }
  .awning { height:40px; background:repeating-linear-gradient(90deg,#F49E8F 0 32px,#FFF3D6 32px 64px); }
  .scallop { height:20px; background:radial-gradient(circle at 16px -5px,#F49E8F 15px,transparent 16px),radial-gradient(circle at 48px -5px,#FFF3D6 15px,transparent 16px); background-size:64px 20px; background-repeat:repeat-x; }
  .wrap { max-width:680px; margin:0 auto; padding:10px 20px 60px; }
  .back { display:inline-block; margin:12px 0 4px; color:#C08552; font-weight:700; text-decoration:none; font-size:17px; }
  h1 { font-size:29px; font-weight:800; margin:8px 0 14px; }
  .intro { background:#fff; border:2px solid #E3CFF2; border-radius:18px; padding:18px 20px; margin-bottom:28px; }
  .sec { background:#fff; border-radius:20px; padding:24px 22px; margin-bottom:22px; box-shadow:0 3px 10px rgba(180,130,80,.08); }
  .sec h2 { font-size:23px; font-weight:800; border-left:8px solid #B48ADE; padding-left:12px; margin-bottom:14px; }
  .sec ol, .sec ul { margin:0 0 12px 1.4em; }
  .sec li { margin-bottom:8px; }
  .point { background:#F7F1FC; border:2px dashed #D9C2F0; border-radius:14px; padding:12px 16px; margin:12px 0; font-size:18px; }
  .imglinks { margin:10px 0 4px; }
  .imgbtn { display:inline-block; background:#F7F1FC; border:2px solid #D9C2F0; color:#8A63B8; border-radius:999px; padding:6px 14px; font-weight:700; text-decoration:none; font-size:16px; margin:0 6px 8px 0; }
  .shot { margin:14px 0 6px; }
  .shot img { width:100%; height:auto; border-radius:12px; border:1px solid #EFE3D2; display:block; }
  .shot.phone img { max-width:430px; margin:0 auto; }
  .shot figcaption { font-size:15px; color:#A9805D; margin-top:4px; text-align:center; }
  .totop { display:block; text-align:center; margin-top:30px; color:#C08552; font-weight:700; text-decoration:none; }
  .pagenav { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:34px; }
  .pagenav a { background:#fff; border:2px solid #F0DFC8; border-radius:999px; padding:8px 16px; color:#C08552; font-weight:700; text-decoration:none; font-size:17px; white-space:nowrap; }
</style>
</head>
<body>
  <div class="awning"></div>
  <div class="scallop"></div>
  <div class="wrap">
    <a class="back" href="profile.html">← プロフィール画像の作り方にもどる</a>
    <h1>プロフィール画像の画面📸</h1>
    <div class="intro">
      iPhoneで写真を切り取る手順の画面です（説明用のイラストです）。<br>
      見終わったら、上の「← プロフィール画像の作り方にもどる」で説明に帰れます🌷
    </div>
    <div class="sec">
      <h2>iPhoneの切り取り（4ステップ）</h2>
      <figure class="shot phone"><img src="img/p1-open.jpg" width="860" height="1180" alt="写真を開いて、右上の「編集」をタップします"><figcaption>写真を開いて、右上の「編集」をタップします</figcaption></figure>
      <figure class="shot phone"><img src="img/p2-edit.jpg" width="860" height="1180" alt="下のメニューで「切り取り」のマークをタップします"><figcaption>下のメニューで「切り取り」のマークをタップします</figcaption></figure>
      <figure class="shot phone"><img src="img/p3-square.jpg" width="860" height="1180" alt="比率は「正方形」を選んで、顔が真ん中に来るよう調整します"><figcaption>比率は「正方形」を選んで、顔が真ん中に来るよう調整します</figcaption></figure>
      <figure class="shot phone"><img src="img/p4-done.jpg" width="860" height="1180" alt="右上の「完了」をタップすれば保存できます"><figcaption>右上の「完了」をタップすれば保存できます</figcaption></figure>
    </div>
    <a class="back" href="profile.html">← プロフィール画像の作り方にもどる</a>
  </div>
</body>
</html>
